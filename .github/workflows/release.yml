name: Release

# Triggered by a vX.Y.Z tag (created by `make release`). Builds the SAFE site
# (annotations only, lyrics stripped), packages dist/ as a downloadable zip, and
# publishes a GitHub Release whose notes are the annotated tag's changelog. The
# raw mirror/ is checked out from the private mirror repo via MIRROR_DEPLOY_KEY;
# the released zip is the public, lyric-free build.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need the annotated tag object for its changelog

      - name: Fetch the raw archive mirror (private repo)
        uses: actions/checkout@v4
        with:
          repository: ds17f/annotatedDead-mirror
          path: .mirror-src
          ssh-key: ${{ secrets.MIRROR_DEPLOY_KEY }}

      - name: Stage mirror/ at the repo root
        run: mv .mirror-src/mirror ./mirror

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Build the safe site (build + strip lyrics)
        run: make safe

      - name: Package dist/ as a zip
        run: |
          ( cd dist && zip -qr "../annotated-gd-lyrics-${GITHUB_REF_NAME}.zip" . )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Generate notes from git log on the runner (robust; no dependence on
          # the tag message, which git may have stripped of Markdown headings).
          scripts/release.sh --notes "${GITHUB_REF_NAME}" > /tmp/notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md \
            "annotated-gd-lyrics-${GITHUB_REF_NAME}.zip"
