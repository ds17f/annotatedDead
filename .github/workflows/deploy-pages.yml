name: Deploy to GitHub Pages

# On every push to main (i.e. after a PR merges), build the site from the
# committed mirror/ and deploy dist/ to GitHub Pages. No archive.org crawl is
# needed — mirror/ is the committed source of truth.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Build dist/
        run: make dist

      - name: Set custom domain (persists across deploys)
        run: echo 'annotated.thedeadly.app' > dist/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dist/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
